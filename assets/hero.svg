<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".75">
    <circle r="70" fill="#6366f1"><animate attributeName="cx" values="120;260;120" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="60;170;60" dur="7s" repeatCount="indefinite"/></circle>
    <circle r="60" fill="#22d3ee"><animate attributeName="cx" values="780;640;780" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="180;60;180" dur="10s" repeatCount="indefinite"/></circle>
    <circle r="45" fill="#ec4899"><animate attributeName="cx" values="450;560;450" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="200;90;200" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="450" y="115" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="url(#tx)" letter-spacing="1">
    Anandaa
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="160" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#cbd5e1">
    full-stack developer · Mongolia<tspan fill="#7dd3fc">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan>
    <animate attributeName="opacity" from="0" to="1" begin=".6s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
